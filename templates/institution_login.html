<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institution Login - CertMAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #F7F9FC; overflow-x: hidden; }
        .gradient-bg { background: linear-gradient(135deg, #FFFFFF 0%, #F0F2F5 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 24px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .glass-card:hover { background: rgba(255, 255, 255, 0.8); border-color: rgba(59, 130, 246, 0.3); transform: translateY(-2px); box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.15); }
        .input-field { background: rgba(0, 0, 0, 0.02); border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 12px; color: #1F2937; transition: all 0.3s ease; }
        .input-field:focus { background: #FFFFFF; border-color: rgba(59, 130, 246, 0.5); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); outline: none; }
        .input-field::placeholder { color: #6B7280; }
        .btn-primary { background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%); border-radius: 12px; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.6); }
        .btn-secondary { background: transparent; border: 1px solid #3B82F6; color: #3B82F6; border-radius: 12px; font-weight: 600; transition: all 0.3s ease; }
        .btn-secondary:hover { background: rgba(59, 130, 246, 0.1); transform: translateY(-2px); }
        #three-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }
        .hero-gradient { background: radial-gradient(ellipse at center, rgba(59, 130, 246, 0.1) 0%, transparent 70%); }
        .institution-badge { background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%); border-radius: 16px; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3); }
        .alert-error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-gray-800 gradient-bg">
    <canvas id="three-canvas"></canvas>

    <nav class="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-md border-b border-gray-200/80">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2z"></path>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4"></path>
    <circle cx="12" cy="2" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="20" cy="6.5" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="20" cy="15.5" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="12" cy="20" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="4" cy="15.5" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="4" cy="6.5" r="1.5" fill="currentColor" stroke="none"></circle>
</svg>
                </div>
                    <span class="text-2xl font-bold text-gray-900">CertMAB</span>
                </a>
                <a href="/" class="text-gray-600 hover:text-blue-600 transition-colors font-medium">← Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="min-h-screen flex items-center justify-center pt-20 relative">
        <div class="hero-gradient absolute inset-0"></div>
        <div class="max-w-md w-full mx-auto px-6 relative z-10">
            <div class="glass-card p-8">
                <div class="text-center mb-8">
                    <div class="institution-badge">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                        </svg>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">Institution Portal</h2>
                    <p class="text-gray-500">Access your institution dashboard</p>
                </div>

                <div id="error-alert" class="alert-error p-4 mb-6 hidden">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-red-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span id="error-message" class="text-red-700 font-medium"></span>
                    </div>
                </div>

                <form id="institution-login-form" method="POST" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Institution Email</label>
                        <input 
                            type="email" 
                            name="email"
                            id="email-input"
                            class="input-field w-full px-4 py-3" 
                            placeholder="Enter your institution email" 
                            required
                        >
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Password</label>
                        <div class="relative">
                            <input 
                                type="password" 
                                name="password"
                                id="password-input"
                                class="input-field w-full px-4 py-3 pr-10" 
                                placeholder="Enter password" 
                                required
                            >
                            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-800">
                                <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>
                                <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 .527-1.664 1.373-3.16 2.458-4.425L13.875 18.825z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.125 5.175A10.05 10.05 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.05 10.05 0 01-2.036 3.875l-1.45-1.45A3 3 0 0010.5 10.5l-1.825-1.825L10.125 5.175z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="text-right -mt-2">
                        <a href="{{ url_for('forgot_password', user_type='institution') }}" class="text-sm text-blue-600 hover:text-blue-800 transition-colors">
                            Forgot Password?
                        </a>
                    </div>
                    
                    <button 
                        type="submit" 
                        class="btn-primary w-full py-4 text-white font-semibold flex items-center justify-center"
                    >
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                        </svg>
                        Access Institution Portal
                    </button>
                </form>

                <div class="mt-6 pt-6 border-t border-gray-200">
                    <div class="text-center">
                        <p class="text-gray-500 text-sm mb-4">Don't have an account?</p>
                        <a href="/institution-signup" class="btn-secondary w-full py-3 font-semibold flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                            Sign Up
                        </a>
                    </div>
                </div>
            </div>

            <div class="mt-6 text-center">
                <p class="text-gray-500 text-sm">
                    Need assistance? Contact <a href="mailto:certmab.control@gmail.com" class="text-blue-600 hover:text-blue-800">certmab.control@gmail.com</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Three.js Background Animation
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        const shapes = [];
        const dodecaGeometry = new THREE.DodecahedronGeometry(8);
        const dodecaMaterial = new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true, transparent: true, opacity: 0.6 });
        const dodecahedron = new THREE.Mesh(dodecaGeometry, dodecaMaterial);
        dodecahedron.position.set(-35, 10, -20);
        scene.add(dodecahedron);
        shapes.push(dodecahedron);
        const icosaGeometry = new THREE.IcosahedronGeometry(6);
        const icosaMaterial = new THREE.MeshBasicMaterial({ color: 0x1d4ed8, wireframe: true, transparent: true, opacity: 0.9 });
        const icosahedron1 = new THREE.Mesh(icosaGeometry, icosaMaterial);
        icosahedron1.position.set(35, 0, -25);
        scene.add(icosahedron1);
        shapes.push(icosahedron1);
        camera.position.z = 30;
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });
        function animate() {
            requestAnimationFrame(animate);
            shapes.forEach((shape, index) => {
                shape.rotation.x += 0.005 + index * 0.002;
                shape.rotation.y += 0.005 + index * 0.002;
                shape.position.y += Math.sin(Date.now() * 0.001 + index) * 0.02;
            });
            camera.position.x += (mouseX * 3 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password-input');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeOpen.classList.toggle('hidden');
            eyeClosed.classList.toggle('hidden');
        });

        // Error handling
        function showError(message) {
            const errorAlert = document.getElementById('error-alert');
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = message;
            errorAlert.classList.remove('hidden');
        }
        document.addEventListener('DOMContentLoaded', function() {
            {% if error %}
                showError('{{ error }}');
            {% endif %}
        });
    </script>
</body>
</html>
