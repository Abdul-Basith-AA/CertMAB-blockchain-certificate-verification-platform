<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - CertMAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* General Body and Font Styles */
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: #f8fafc; /* Light gray background */
            color: #1e293b; /* Dark slate text */
            overflow-x: hidden;
        }
        
        /* Main Form Card */
        .form-card {
            background: #ffffff;
            border: 1px solid #e2e8f0; /* Lighter border */
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .form-card:hover {
            border-color: #f59e0b; /* Amber border on hover */
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        /* Input Field Styling */
        .input-field {
            background: #f1f5f9; /* Light slate background for inputs */
            border: 1px solid #cbd5e0;
            border-radius: 12px;
            color: #1e293b;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            background: #ffffff;
            border-color: #f59e0b; /* Amber focus border */
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
            outline: none;
        }
        
        .input-field::placeholder {
            color: #94a3b8; /* Slate placeholder text */
        }
        
        /* Primary Button (Kept the original accent color) */
        .btn-primary {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border-radius: 12px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
        }
        
        /* Three.js Canvas Background */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.15; /* Adjusted opacity for light theme */
        }
        
        /* Decorative Gradient */
        .hero-gradient {
            background: radial-gradient(ellipse at center, rgba(234, 179, 8, 0.1) 0%, transparent 70%);
        }
        
        /* Student Icon Badge */
        .student-badge {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border-radius: 16px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3);
        }
        
        /* Error Alert Box */
        .alert-error {
            background: #fee2e2; /* Light red background */
            border: 1px solid #fecaca;
            border-radius: 12px;
        }
    </style>
</head>
<body class="text-slate-800">
    <!-- Three.js Background -->
    <canvas id="three-canvas"></canvas>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-md border-b border-gray-200/80">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-amber-500 to-yellow-500 rounded-lg flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2z"></path>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4"></path>
    <circle cx="12" cy="2" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="20" cy="6.5" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="20" cy="15.5" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="12" cy="20" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="4" cy="15.5" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="4" cy="6.5" r="1.5" fill="currentColor" stroke="none"></circle>
</svg>
                </div>
                    <span class="text-2xl font-bold text-slate-900">CertMAB</span>
                </a>
                <a href="/" class="text-gray-600 hover:text-slate-900 transition-colors">← Back to Home</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="min-h-screen flex items-center justify-center pt-20 relative">
        <div class="hero-gradient absolute inset-0"></div>
        <div class="max-w-md w-full mx-auto px-6 relative z-10">
            <div class="form-card p-8">
                <header class="text-center mb-8">
                    <div class="student-badge">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <h2 class="text-3xl font-bold text-slate-900 mb-2">Student Portal</h2>
                    <p class="text-gray-500">Access your digital certificate wallet</p>
                </header>

                <!-- Error Alert -->
                {% if error %}
                <div class="alert-error p-4 mb-6">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span class="text-red-700 font-medium">{{ error }}</span>
                    </div>
                </div>
                {% endif %}

                <form method="POST" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-600 mb-2">Email Address</label>
                        <input 
                            id="email"
                            type="email" 
                            name="email" 
                            class="input-field w-full px-4 py-3" 
                            placeholder="Enter your email" 
                            required
                        >
                    </div>

                    <!-- Password Field with Visibility Toggle -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-600 mb-2">Password</label>
                        <div class="relative">
                            <input 
                                id="password"
                                type="password" 
                                name="password" 
                                class="input-field w-full px-4 py-3 pr-10" 
                                placeholder="Enter your password" 
                                required
                            >
                            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-slate-800 focus:outline-none">
                                <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 .946-3.11 3.565-5.556 6.818-6.525M16.5 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.938 21.938l-14-14 .062-.062M9.875 9.875l-1.437-1.437"></path></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="text-right -mt-2">
                        <a href="{{ url_for('forgot_password', user_type='student') }}" class="text-sm text-amber-600 hover:text-amber-500 transition-colors font-medium">
                            Forgot Password?
                        </a>
                    </div>
   
                    <button 
                        type="submit" 
                        class="btn-primary w-full py-4 text-white font-semibold flex items-center justify-center"
                    >
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                        </svg>
                        Login to Student Portal
                    </button>
                </form>
                
                <footer class="text-center mt-6">
                    <p class="text-sm text-gray-500">
                        Don't have an account? 
                        <a href="/student-signup" class="font-medium text-amber-600 hover:text-amber-500">Sign Up</a>
                    </p>
                </footer>
            </div>
        </div>
    </main>

    <script>
        // Three.js Background Animation
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('three-canvas'), 
            alpha: true,
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const shapes = [];
        
        const dodecaGeometry = new THREE.DodecahedronGeometry(8);
        const dodecaMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x1e293b, // Dark slate color for shapes
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const dodecahedron = new THREE.Mesh(dodecaGeometry, dodecaMaterial);
        dodecahedron.position.set(-30, 0, -20);
        scene.add(dodecahedron);
        shapes.push(dodecahedron);

        const icosaGeometry = new THREE.IcosahedronGeometry(9);
        const icosaMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x334155, // Slightly lighter slate
            wireframe: true,
            transparent: true,
            opacity: 1
        });
        const icosahedron = new THREE.Mesh(icosaGeometry, icosaMaterial);
        icosahedron.position.set(35, 20, -35);
        scene.add(icosahedron);
        shapes.push(icosahedron);

        camera.position.z = 30;

        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            
            shapes.forEach((shape, index) => {
                shape.rotation.x += 0.005 + index * 0.001;
                shape.rotation.y += 0.005 + index * 0.001;
                shape.position.y += Math.sin(Date.now() * 0.001 + index) * 0.02;
            });

            camera.position.x += (mouseX * 3 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Password visibility script
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeOpen.classList.toggle('hidden');
            eyeClosed.classList.toggle('hidden');
        });
    </script>
</body>
</html>
