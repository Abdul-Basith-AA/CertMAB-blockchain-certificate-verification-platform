<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CertMAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb; /* Neutral light background */
            overflow-x: hidden;
        }
        .form-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .form-card:hover {
            border-color: #fca5a5; /* Light red border on hover */
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .input-field {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            color: #1e293b;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: #ffffff;
            border-color: #ef4444; /* Red border on focus */
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
            outline: none;
        }
        .input-field::placeholder {
            color: #94a3b8;
        }
        .btn-primary {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            border-radius: 12px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4);
        }
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.3;
        }
        .hero-gradient {
            background: radial-gradient(ellipse at center, rgba(239, 68, 68, 0.1) 0%, transparent 70%);
        }
        .admin-badge {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            border-radius: 16px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3);
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
        }
    </style>
</head>
<body class="text-gray-800">
    <canvas id="three-canvas"></canvas>

    <nav class="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-md border-b border-gray-200/80">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-red-600 to-red-800 rounded-lg flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2z"></path>
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4"></path>
    <circle cx="12" cy="2" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="20" cy="6.5" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="20" cy="15.5" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="12" cy="20" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="4" cy="15.5" r="1.5" fill="currentColor" stroke="none"></circle>
    <circle cx="4" cy="6.5" r="1.5" fill="currentColor" stroke="none"></circle>
</svg>
                </div>
                    <span class="text-2xl font-bold text-gray-900">CertMAB</span>
                </a>
                <a href="/" class="text-gray-600 hover:text-red-600 transition-colors font-medium">← Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="min-h-screen flex items-center justify-center pt-20 relative">
        <div class="hero-gradient absolute inset-0"></div>
        <div class="max-w-md w-full mx-auto px-6 relative z-10">
            <div class="form-card p-8">
                <div class="text-center mb-8">
                    <div class="admin-badge">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">Admin Portal</h2>
                    <p class="text-gray-500">Access the administrative dashboard</p>
                </div>

                {% if error %}
                <div class="alert-error p-4 mb-6">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="text-red-700">{{ error }}</span>
                    </div>
                </div>
                {% endif %}

                <form method="POST" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Username</label>
                        <input type="text" name="username" class="input-field w-full px-4 py-3" placeholder="Enter admin username" required>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-2">Password</label>
                        <div class="relative">
                            <input id="password-input" type="password" name="password" class="input-field w-full px-4 py-3 pr-10" placeholder="Enter password" required>
                            <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-red-600">
                                <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 1.274-4.057 5.064 7 9.542 7 .847 0 1.67.111 2.458.325M15 12a3 3 0 11-6 0 3 3 0 016 0zm6 4l-2.6-2.6m-3.8-3.8L21 16.4M3 3l18 18"></path></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary w-full py-4 font-semibold flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                        Access Admin Portal
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script>
        // Three.js Background Animation (colors updated back to red)
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        const shapes = [];
        const octaGeometry = new THREE.OctahedronGeometry(8);
        const octaMaterial = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true, transparent: true, opacity: 0.8 });
        const octahedron = new THREE.Mesh(octaGeometry, octaMaterial);
        octahedron.position.set(-30, 0, -20);
        scene.add(octahedron);
        shapes.push(octahedron);

        const tetraGeometry = new THREE.TetrahedronGeometry(9);
        const tetraMaterial = new THREE.MeshBasicMaterial({ color: 0xdc2626, wireframe: true, transparent: true, opacity: 1 });
        const tetrahedron = new THREE.Mesh(tetraGeometry, tetraMaterial);
        tetrahedron.position.set(35, 20, -35);
        scene.add(tetrahedron);
        shapes.push(tetrahedron);

        camera.position.z = 30;
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            shapes.forEach((shape, index) => {
                shape.rotation.x += 0.005 + index * 0.002;
                shape.rotation.y += 0.005 + index * 0.002;
                shape.position.y += Math.sin(Date.now() * 0.001 + index) * 0.02;
            });
            camera.position.x += (mouseX * 3 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Password visibility toggle
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password-input');
        const eyeOpen = document.querySelector('#eye-open');
        const eyeClosed = document.querySelector('#eye-closed');

        if (togglePassword) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                eyeOpen.classList.toggle('hidden');
                eyeClosed.classList.toggle('hidden');
            });
        }
    </script>
</body>
</html>
