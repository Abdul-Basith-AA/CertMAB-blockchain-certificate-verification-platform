<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Login - CertMAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* General Styling */
        :root {
            --primary-green: #22C55E;
            --primary-green-dark: #16A34A;
            --primary-green-light: #86EFAC;
        }

        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background-color: #F9FAFB; /* Light gray background */
            overflow-x: hidden;
            color: #1F2937; /* Dark gray text */
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        
        /* Card Styling */
        .content-card {
            background: #FFFFFF;
            border-radius: 24px;
            border: 1px solid #E5E7EB;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
            transition: all 0.3s ease-in-out;
        }

        .content-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.1);
        }
        
        /* Form Elements */
        .input-field {
            background: #F3F4F6;
            border: 1px solid #D1D5DB;
            border-radius: 12px;
            color: #1F2937;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            background: #FFFFFF;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
            outline: none;
        }
        
        .input-field::placeholder {
            color: #9CA3AF;
        }
        
        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
            border-radius: 12px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
        }

        .btn-secondary {
            background: #E5E7EB;
            border: 1px solid #D1D5DB;
            border-radius: 12px;
            font-weight: 600;
            color: #374151;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: #D1D5DB;
            transform: translateY(-2px);
        }
        
        /* Background Animation */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.3;
        }
        
        .hero-gradient {
            background: radial-gradient(ellipse at center, rgba(34, 197, 94, 0.1) 0%, transparent 70%);
        }
        
        .company-badge {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-dark) 100%);
            border-radius: 16px;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.3);
        }
        
        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
        }
    </style>
</head>
<body class="gradient-bg">
    <canvas id="three-canvas"></canvas>

    <nav class="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-md border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-green-500 to-emerald-600 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <span class="text-2xl font-bold text-gray-800">CertMAB</span>
                </a>
                <a href="/" class="text-gray-600 hover:text-gray-900 font-medium transition-colors">← Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="min-h-screen flex items-center justify-center pt-20 relative">
        <div class="hero-gradient absolute inset-0"></div>
        <div class="max-w-md w-full mx-auto px-6 relative z-10">
            <div class="content-card p-8">
                <div class="text-center mb-8">
                    <div class="company-badge">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">Company Portal</h2>
                    <p class="text-gray-600">Access certificate verification</p>
                </div>

                <!-- Error Alert Display -->
                {% if error %}
                <div id="error-alert" class="alert-error p-4 mb-6">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-red-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span id="error-message" class="text-red-700 text-sm font-medium">{{ error }}</span>
                    </div>
                </div>
                {% endif %}

                <form id="company-login-form" method="POST" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Company Email</label>
                        <input type="email" id="email" name="email" class="input-field w-full px-4 py-3" placeholder="Enter your company email" required>
                    </div>

                    <div>
                        <label for="password-input" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <input id="password-input" type="password" name="password" class="input-field w-full px-4 py-3 pr-10" placeholder="Enter password" required>
                            <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-800">
                                <svg id="eye-icon" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                <svg id="eye-slash-icon" class="h-5 w-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7 .91-2.92 3.19-5.245 5.824-6.152M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 2l20 20"></path></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="text-right -mt-2">
                        <a href="{{ url_for('forgot_password', user_type='company') }}" class="text-sm text-green-600 hover:text-green-500 transition-colors font-medium">
                            Forgot Password?
                        </a>
                    </div>
                    
                    <button type="submit" class="btn-primary w-full py-4 flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                        </svg>
                        Access Company Portal
                    </button>
                </form>

                <div class="mt-6 pt-6 border-t border-gray-200">
                    <div class="text-center">
                        <p class="text-gray-500 text-sm mb-4">Don't have an account?</p>
                        <a href="/company-signup" class="btn-secondary w-full py-3 flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                            Create Account
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Three.js Background Animation
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('three-canvas'), 
            alpha: true,
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        const shapes = [];
        
        const torusGeometry = new THREE.TorusGeometry(8, 1, 16, 100);
        const torusMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x22C55E,
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        torus.position.set(-30, 0, -20);
        scene.add(torus);
        shapes.push(torus);

        const boxGeometry = new THREE.BoxGeometry(9, 9, 9);
        const boxMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x16A34A,
            wireframe: true,
            transparent: true,
            opacity: 1
        });
        const box = new THREE.Mesh(boxGeometry, boxMaterial);
        box.position.set(35, 20, -35);
        scene.add(box);
        shapes.push(box);

        camera.position.z = 30;

        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            
            shapes.forEach((shape, index) => {
                shape.rotation.x += 0.005 + index * 0.002;
                shape.rotation.y += 0.005 + index * 0.002;
                shape.position.y += Math.sin(Date.now() * 0.001 + index) * 0.02;
            });

            camera.position.x += (mouseX * 3 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Password visibility toggle
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password-input');
        const eyeIcon = document.getElementById('eye-icon');
        const eyeSlashIcon = document.getElementById('eye-slash-icon');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                eyeIcon.classList.toggle('hidden');
                eyeSlashIcon.classList.toggle('hidden');
            });
        }
    </script>
</body>
</html>
