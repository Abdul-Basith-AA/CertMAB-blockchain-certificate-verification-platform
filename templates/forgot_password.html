<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CertMAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #F9FAFB; }
        .gradient-bg { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
        .content-card { 
            background: #FFFFFF;
            border-radius: 24px;
            border: 1px solid #E5E7EB;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
        }
        .input-field { 
            background: #F3F4F6;
            border: 1px solid #D1D5DB;
            border-radius: 12px;
            color: #1F2937;
        }
        .input-field:focus { 
            border-color: #3B82F6; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn-primary { 
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); 
            border-radius: 12px; 
            font-weight: 600;
            color: white;
        }
    </style>
</head>
<body class="text-gray-800 gradient-bg">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full mx-auto">
            <div class="content-card p-8">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">Reset Password</h2>
                    <p class="text-gray-600">Enter your email to receive a reset link.</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="p-4 mb-4 text-sm rounded-lg {% if category == 'success' %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}" role="alert">
                        {{ message }}
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('forgot_password', user_type=user_type) }}" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                        <input type="email" name="email" class="input-field w-full px-4 py-3" placeholder="Enter your registered email" required>
                    </div>
                    <button type="submit" class="btn-primary w-full py-3 font-semibold">
                        Send Reset Link
                    </button>
                </form>
                 <div class="text-center mt-6">
                    <a href="/" class="text-gray-500 hover:text-gray-800 transition-colors">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
