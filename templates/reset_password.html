<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - CertMAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #F9FAFB; }
        .gradient-bg { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
        .content-card { 
            background: #FFFFFF;
            border-radius: 24px;
            border: 1px solid #E5E7EB;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05), 0 8px 10px -6px rgb(0 0 0 / 0.05);
        }
        .input-field { 
            background: #F3F4F6;
            border: 1px solid #D1D5DB;
            border-radius: 12px;
            color: #1F2937;
        }
        .input-field:focus { 
            border-color: #3B82F6; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .btn-primary { 
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); 
            border-radius: 12px; 
            font-weight: 600;
            color: white;
        }
    </style>
</head>
<body class="text-gray-800 gradient-bg">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full mx-auto">
            <div class="content-card p-8">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-bold text-gray-900 mb-2">Create New Password</h2>
                    <p class="text-gray-600">Please enter and confirm your new password.</p>
                </div>

                {% if error %}
                <div class="p-4 mb-4 text-sm text-red-800 bg-red-100 rounded-lg" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                        <input type="password" name="password" class="input-field w-full px-4 py-3" required>
                    </div>
                     <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="input-field w-full px-4 py-3" required>
                    </div>
                    <button type="submit" class="btn-primary w-full py-3 font-semibold">
                        Update Password
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
