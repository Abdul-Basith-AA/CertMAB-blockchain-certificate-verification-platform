<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CertChain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0A0A0A; overflow-x: hidden; }
        
        .gradient-bg { background: linear-gradient(135deg, #0F0F23 0%, #1A1A2E 50%, #16213E 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .input-field { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #FFFFFF; backdrop-filter: blur(10px); transition: all 0.3s ease; }
        .input-field:focus { background: rgba(255, 255, 255, 0.08); border-color: rgba(234, 179, 8, 0.5); box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.1); outline: none; }
        .input-field::placeholder { color: rgba(255, 255, 255, 0.5); }
        .btn-primary { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); border-radius: 12px; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6); }
        #three-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.3; }
        .hero-gradient { background: radial-gradient(ellipse at center, rgba(234, 179, 8, 0.15) 0%, transparent 70%); }
        .student-badge { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); border-radius: 16px; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; box-shadow: 0 8px 25px rgba(245, 158, 11, 0.3); }
        .alert-error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; backdrop-filter: blur(10px); }
        .alert-success { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 12px; backdrop-filter: blur(10px); }
        /* This styles the dropdown options list */
.input-field option {
    background: #1A1A2E; /* Sets a dark background for the options */
    color: #FFFFFF;      /* Sets the text color of the options to white */
}

/* This adds a custom arrow to the dropdown box */
select.input-field {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
    background-position: right 0.5rem center;
    background-repeat: no-repeat;
    background-size: 1.5em 1.5em;
    padding-right: 2.5rem;
}
    </style>
</head>
<body class="text-white gradient-bg">
    <canvas id="three-canvas"></canvas>
    <nav class="fixed top-0 w-full z-40 bg-black/80 backdrop-blur-md border-b border-gray-800/50">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <span class="text-2xl font-bold text-white">CertChain</span>
                </a>
                <a href="/student-login" class="text-gray-300 hover:text-white transition-colors">← Back to Login</a>
            </div>
        </div>
    </nav>
    <div class="min-h-screen flex items-center justify-center pt-20 relative">
        <div class="hero-gradient absolute inset-0"></div>
        <div class="max-w-md w-full mx-auto px-6 relative z-10">
            <div class="glass-card p-8">
                <div class="text-center mb-8">
                    <div class="student-badge">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H5v-2H3v-2H1v-4a6 6 0 016-6h1a2 2 0 012 2z"></path></svg>
                    </div>
                    <h2 class="text-3xl font-bold text-white mb-2">Reset Password</h2>
                    <p class="text-gray-300">Enter your email to receive a reset link</p>
                </div>

                {% if error %}
                <div class="alert-error p-4 mb-6">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="text-red-300">{{ error }}</span>
                    </div>
                </div>
                {% endif %}
                {% if message %}
                <div class="alert-success p-4 mb-6">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-green-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="text-green-300">{{ message }}</span>
                    </div>
                </div>
                {% endif %}

                <form method="POST" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                        <input type="email" name="email" class="input-field w-full px-4 py-3" placeholder="Enter your registered email" required>
                    </div>
                    <button type="submit" class="btn-primary w-full py-4 text-white font-semibold flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        Send Reset Link
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        const shapes = [];
        const dodecaGeometry = new THREE.DodecahedronGeometry(8);
        const dodecaMaterial = new THREE.MeshBasicMaterial({ color: 0xF59E0B, wireframe: true, transparent: true, opacity: 0.8 });
        const dodecahedron = new THREE.Mesh(dodecaGeometry, dodecaMaterial);
        dodecahedron.position.set(-30, 0, -20);
        scene.add(dodecahedron);
        shapes.push(dodecahedron);
        const icosaGeometry = new THREE.IcosahedronGeometry(9);
        const icosaMaterial = new THREE.MeshBasicMaterial({ color: 0xD97706, wireframe: true, transparent: true, opacity: 1 });
        const icosahedron = new THREE.Mesh(icosaGeometry, icosaMaterial);
        icosahedron.position.set(35, 20, -35);
        scene.add(icosahedron);
        shapes.push(icosahedron);
        camera.position.z = 30;
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });
        function animate() {
            requestAnimationFrame(animate);
            shapes.forEach((shape, index) => {
                shape.rotation.x += 0.005 + index * 0.002;
                shape.rotation.y += 0.005 + index * 0.002;
                shape.position.y += Math.sin(Date.now() * 0.001 + index) * 0.02;
            });
            camera.position.x += (mouseX * 3 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 3 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
